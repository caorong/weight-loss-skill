<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__BRAND__</title>
<link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
<link href="/fonts/notosans/notosans.css" rel="stylesheet">
<style>
@font-face { font-family: "Poppins"; font-style: normal; font-weight: 700; font-display: swap; src: url("https://nanorhino-openclaw-user-dashboard.chatlingxi.com/fonts/poppins-700.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', system-ui, sans-serif; background: #FAFAFA; color: #333; line-height: 1.5; font-size: 14px; -webkit-text-size-adjust: 100%; font-feature-settings: "tnum"; }
.page { max-width: 800px; margin: 0 auto; padding: 12px 16px 2rem; background: #FAFAFA; }
.report-header { text-align: center; margin-top: 0.375rem; margin-bottom: 0.3rem; padding-bottom: 0.25rem; }
.report-header h1 { font-size: 1.5rem; font-weight: 900; color: #1a1a1a; margin-bottom: 0.15rem; letter-spacing: 0.06em; }
.report-header h1 .wk-num { color: #D73C63; font-family: "Poppins", sans-serif; font-weight: 700; font-size: 1.55em; }
.report-header .subtitle { font-size: 0.78rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.report-header .date-range { font-size: 0.75rem; color: #aaa; margin-top: 0.1rem; }
.report-card { background: #fff; border: none; border-radius: 16px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.card-header { padding: 16px 20px 0; font-family: "Poppins", system-ui, "PingFang SC", -apple-system, sans-serif; font-size: 14px; font-weight: 500; color: #6B7280; border-bottom: none; }
.card-body { padding: 16px 20px; }
.card-body.cal-body { padding-top: 32px; }
.card-commentary { font-size: 0.85rem; color: #666; padding: 0.6rem 21px 0.8rem; border-top: 1px solid #F3F4F6; line-height: 1.6; }
.logging-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 0.3rem; }
.logging-grid .day-label { font-size: 0.78rem; color: #888; font-weight: 500; padding: 0.3rem 0; }
.logging-grid .day-cells { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 0.2rem 0 0.3rem; }
.logging-grid .meal-cell { width: 18px; height: 8px; border-radius: 3px; background: #F3F4F6; }
.logging-grid .meal-cell.hit { background: #F2A0B5; }
.logging-summary { text-align: center; font-size: 0.85rem; font-weight: 600; color: #333; padding-top: 0.5rem; }
.meal-tally { display: flex; justify-content: space-between; gap: 10px; padding-top: 12px; margin-top: 8px; }
.meal-tally .tally-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0px; background: #F5F5F7; border-radius: 14px; padding: 7px 4px 6px; }
.meal-tally .tally-mealname { font-size: 0.82rem; font-weight: 700; color: #1a1a1a; }
.meal-tally .tally-num { font-weight: 800; color: #1a1a1a; }
.meal-tally .tally-num .cur { font-size: 1.5rem; color: #D73C63; font-family: "Poppins", sans-serif; font-weight: 700; }
.meal-tally .tally-num .denom { color: #9CA3AF; font-weight: 600; font-size: 0.85rem; margin-left: 2px; }
.meal-tally .tally-delta { font-size: 0.72rem; color: #9CA3AF; font-weight: 500; }
.cal-chart { position: relative; height: 220px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 0 0 2rem; margin-bottom: 0.4rem; }
.cal-target-band { position: absolute; left: 2rem; right: 0; background: rgba(0,0,0,0.05); z-index: 0; }
.cal-target-label { position: absolute; right: 4px; top: 2px; font-size: 0.65rem; color: #aaa; }
.cal-grid-line { position: absolute; left: 2rem; right: 0; height: 0; border-bottom: 1px dashed #e8e5dd; z-index: 0; }
.cal-grid-label { position: absolute; left: -2rem; width: 2rem; padding-right: 5px; text-align: right; white-space: nowrap; transform: translateY(-50%); font-size: 10px; color: #bbb; font-weight: 500; }
.cal-bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; z-index: 1; position: relative; }
.cal-bar-wrapper { width: 60%; max-width: 36px; }
.cal-bar { width: 100%; border-radius: 6px 6px 0 0; transition: height 0.3s; opacity: 0.75; }
.cal-bar-value { font-size: 10px; color: #555; margin-bottom: 2px; font-weight: 500; }
.cal-x-labels { display: flex; justify-content: space-between; padding: 0.3rem 0 0 2rem; }
.cal-x-label { flex: 1; text-align: center; font-size: 0.75rem; color: #888; font-weight: 500; }
.cal-target-note { text-align: center; font-size: 0.72rem; color: #bbb; padding-top: 0.6rem; }
.cal-average { text-align: center; font-size: 0.85rem; font-weight: 600; color: #333; padding-top: 0.15rem; }
.cal-average .sub { font-weight: 400; font-size: 0.78rem; color: #888; display: block; margin-top: 0.15rem; }
.macro-chart-section { margin-bottom: 4.5rem; }
.macro-chart-section:first-of-type { margin-top: 1.5rem; }
.macro-chart-section:last-of-type { margin-bottom: 0.5rem; }
.macro-chart-title { text-align: center; font-size: 0.82rem; font-weight: 600; color: #333; margin-bottom: 1.5rem; }
.macro-avg-line { position: absolute; left: 2rem; right: 0; height: 0; border-top: 1px dashed #333; z-index: 2; }
.macro-avg-label { position: absolute; right: 4px; transform: translateY(-100%); font-size: 0.65rem; color: #333; font-weight: 500; }
.weight-chart-wrapper { position: relative; display: flex; margin-bottom: 0.6rem; }
.weight-y-axis { width: 2rem; flex-shrink: 0; position: relative; height: 175px; padding-right: 5px; }
.weight-y-label { position: absolute; left: 0; font-size: 10px; color: #bbb; transform: translateY(-50%); }
.weight-chart-container { position: relative; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; flex: 1; }
.weight-chart-container::-webkit-scrollbar { height: 4px; }
.weight-chart-container::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
.weight-chart-scroll-hint { text-align: center; font-size: 0.72rem; color: #bbb; margin-top: 0.3rem; }
.weight-change { text-align: center; font-size: 0.85rem; font-weight: 600; color: #333; padding-top: 0.3rem; }
.weight-change.same { color: #888; }
.weight-change.up { color: #e57373; }
.weight-change.down { color: #6bcb8b; }
.weight-progress { text-align: center; font-size: 0.78rem; color: #888; padding-top: 0.2rem; }
.section-subtitle { font-size: 0.85rem; font-weight: 600; color: #D73C63; margin-bottom: 0.3rem; padding-top: 0.3rem; }
.section-subtitle:first-child { padding-top: 0; }
.suggestions-divider { border: none; border-top: 1px solid #F3F4F6; margin: 0.6rem 0; }
.achievement-list, .suggestion-list { padding-left: 1.2rem; font-size: 0.82rem; color: #444; }
.achievement-list li, .suggestion-list li { margin-bottom: 0.3rem; }
.achievement-list li::marker { color: #D73C63; }
.week-nav { display: flex; justify-content: space-between; align-items: center; background: transparent; padding: 1rem 0 1.6rem; margin-top: 1rem; }
.week-nav-btn { display: inline-block; padding: 0.35rem 0.7rem; background: #D73C63; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.78rem; font-weight: 600; transition: background 0.2s; cursor: pointer; }
.week-nav-btn:hover { background: #bf2e54; }
.week-nav-btn.disabled { background: #ccc; color: #999; pointer-events: none; cursor: default; }
.week-nav-current { font-size: 0.78rem; color: #666; font-weight: 500; }
.report-footer { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem; padding-top: 1.2rem; border-top: 1px solid #F3F4F6; }
.report-footer img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.report-footer .brand-name { font-family: 'Irish Grover', cursive; font-size: 1.1rem; color: #D73C63; margin: 0; }
.report-disclaimer { text-align: center; font-size: 0.8rem; color: #aaa; margin-top: 0.5rem; }
.loading { text-align: center; padding: 4rem 1rem; color: #888; font-size: 1rem; }
.error { text-align: center; padding: 4rem 1rem; color: #e57373; font-size: 1rem; }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="loading" id="loading">__LOADING__</div>
  <div class="error" id="error" style="display:none;"></div>
  <div id="content" style="display:none;"></div>
</div>

<script>
(function() {
  'use strict';

  // ─── i18n ───────────────────────────────────────────────────────────
  var I18N = {
    zh: {
      title: '第{N}周周报',
      loading: '加载中...',
      noData: '本周没有记录数据',
      noDataHint: '开始记录后，这里会出现详细的分析报告',
      weekNotFound: '找不到第 {week} 周的数据',
      noReportYet: '暂无周报数据',
      prevWeek: '← 上一周',
      nextWeek: '下一周 →',
      weekLabel: '第{N}周',
      loggingHeader: '打卡记录',
      loggingDays: '记录 {x}/{y} 天',
      mealBreakfast: '早餐',
      mealLunch: '午餐',
      mealDinner: '晚餐',
      vsLastWeek: '较上周',
      sameAsLastWeek: '与上周持平',
      calorieHeader: '热量分析',
      avgCal: '日均约 {avg} kcal',
      avgCalSimple: '日均 {avg} kcal',
      avgCalTarget: '目标 {min}–{max}',
      missingMeals: '{n}天有漏记',
      weightHeader: '体重记录',
      noWeight: '暂无体重数据',
      thisWeekChange: '本周 {sign}{change} kg（{from}→{to}）',
      thisWeekSingle: '本周称重 1 次 · {val} kg',
      macroHeader: '营养素分析',
      macroEstNote: '* 部分天数记录不全，缺失餐次按本周同类餐平均值估算',
      carbs: '碳水',
      protein: '蛋白质',
      fat: '脂肪',
      targetLabel: '目标 {min}–{max}',
      avgIntake: '平均摄入 {val}',
      highlightsHeader: '本周亮点 & 建议',
      highlightsOnlyHeader: '本周亮点',
      suggestionsOnlyHeader: '下周建议',
      highlights: '亮点',
      suggestions: '下周建议',
      defaultHighlight: '坚持记录就是最大的亮点 💪',
      defaultSuggestion: '继续保持，下周见 🐰',
      scrollHint: '← 左右滑动查看更多 →',
      planRate: '计划 −{rate}kg/周',
      disclaimer: '小犀牛AI营养师生成 · 仅供参考',
      weekdays: ['周一','周二','周三','周四','周五','周六','周日']
    },
    en: {
      title: 'Week {N} Report',
      loading: 'Loading...',
      noData: 'No data recorded this week',
      noDataHint: 'Start logging and your analysis will appear here',
      weekNotFound: 'Data for week {week} not found',
      noReportYet: 'No report data yet',
      prevWeek: '← Previous',
      nextWeek: 'Next →',
      weekLabel: 'Week {N}',
      loggingHeader: 'Meal Log',
      loggingDays: 'Logged {x}/{y} days',
      mealBreakfast: 'Breakfast',
      mealLunch: 'Lunch',
      mealDinner: 'Dinner',
      vsLastWeek: 'vs last week ',
      sameAsLastWeek: 'same as last week',
      calorieHeader: 'Calorie Analysis',
      avgCal: 'Daily avg ~{avg} kcal',
      avgCalSimple: 'Daily avg {avg} kcal',
      avgCalTarget: 'Target {min}–{max}',
      missingMeals: '{n} days incomplete',
      weightHeader: 'Weight Progress',
      noWeight: 'No weight data yet',
      thisWeekChange: 'This week {sign}{change} kg ({from}→{to})',
      thisWeekSingle: '1 weigh-in · {val} kg',
      macroHeader: 'Macronutrients',
      macroEstNote: '* Some days incomplete; missing meals estimated from weekly averages',
      carbs: 'Carbs',
      protein: 'Protein',
      fat: 'Fat',
      targetLabel: 'Target {min}–{max}',
      avgIntake: 'Avg {val}',
      highlightsHeader: 'Highlights & Suggestions',
      highlightsOnlyHeader: 'This Week',
      suggestionsOnlyHeader: 'Next Week',
      highlights: 'Highlights',
      suggestions: 'Next Week',
      defaultHighlight: 'Showing up and logging is the biggest win 💪',
      defaultSuggestion: 'Keep going, see you next week 🐰',
      scrollHint: '← Scroll for more →',
      planRate: 'Plan −{rate}kg/wk',
      disclaimer: 'Generated by NanoRhino AI Nutritionist · For reference only',
      weekdays: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    }
  };

  var lang = 'zh'; // default, overridden by data.meta.lang

  function t(key, params) {
    var s = (I18N[lang] || I18N.zh)[key] || I18N.zh[key] || key;
    if (params) {
      Object.keys(params).forEach(function(k) {
        s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
      });
    }
    return s;
  }

  // ─── Utility ────────────────────────────────────────────────────────
  function niceTicks(maxVal, preferredCount) {
    preferredCount = preferredCount || 4;
    if (maxVal <= 0) return [0];
    var rawStep = maxVal / preferredCount;
    var magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
    var step = magnitude;
    var niceVals = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < niceVals.length; i++) {
      step = niceVals[i] * magnitude;
      if (maxVal / step <= preferredCount + 1) break;
    }
    var ticks = [];
    for (var v = 0; v <= maxVal * 1.01; v += step) {
      ticks.push(Math.round(v));
    }
    return ticks;
  }

  function catmullRomPath(points) {
    var n = points.length;
    if (n < 2) return '';
    var path = 'M ' + points[0][0] + ',' + points[0][1];
    for (var i = 0; i < n - 1; i++) {
      var p0 = points[Math.max(0, i - 1)];
      var p1 = points[i];
      var p2 = points[Math.min(n - 1, i + 1)];
      var p3 = points[Math.min(n - 1, i + 2)];
      var cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      var cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      var cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      var cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      path += ' C ' + cp1x.toFixed(1) + ',' + cp1y.toFixed(1) + ' ' +
              cp2x.toFixed(1) + ',' + cp2y.toFixed(1) + ' ' +
              p2[0] + ',' + p2[1];
    }
    return path;
  }

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // 去掉文本里的 emoji(打卡记录 AI 评论不要 emoji),顺带清理多余空格
  function stripEmoji(s) {
    if (!s) return '';
    return s
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function parseDate(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  // ─── Chart: Calorie bars ────────────────────────────────────────────
  function renderCalorieChart(days, calMin, calMaxTarget, chartMax) {
    var chartH = 220;
    var ticks = niceTicks(chartMax, 4);
    if (ticks.length) {
      var tickMax = Math.max.apply(null, ticks);
      if (tickMax < chartMax) ticks.push(Math.round(tickMax + (ticks[1] - ticks[0])));
      chartMax = Math.max.apply(null, ticks);
    }
    var bandBottom = (calMin / chartMax) * 100;
    var bandHeight = ((calMaxTarget - calMin) / chartMax) * 100;

    var h = '<div class="cal-chart">\n';
    for (var i = 0; i < ticks.length; i++) {
      var tick = ticks[i];
      var pct = (tick / chartMax) * 100;
      var solid = tick === 0 ? ' border-bottom-style: solid;' : '';
      h += '<div class="cal-grid-line" style="bottom:' + pct.toFixed(1) + '%;' + solid + '"><span class="cal-grid-label">' + tick + '</span></div>\n';
    }
    h += '<div class="cal-target-band" style="bottom:' + bandBottom.toFixed(1) + '%;height:' + bandHeight.toFixed(1) + '%"><span class="cal-target-label">' + t('targetLabel', {min: calMin, max: calMaxTarget}) + '</span></div>\n';

    for (var j = 0; j < days.length; j++) {
      var d = days[j];
      var cal = d.totals.cal;
      var status = d.cal_status || 'below';
      if (!d.logged || cal === 0) {
        h += '<div class="cal-bar-col"><div class="cal-bar-value"></div><div class="cal-bar-wrapper"><div class="cal-bar" style="height:0px;background:transparent;"></div></div></div>\n';
      } else {
        var barH = Math.min(Math.round((cal / chartMax) * chartH), Math.round(chartH * 0.85));
        var colors = {below: '#c8e6c9', 'on-target': '#6bcb8b', over: '#fdd0b1'};
        var color = colors[status] || '#c8e6c9';
        h += '<div class="cal-bar-col"><div class="cal-bar-value">' + cal + '</div><div class="cal-bar-wrapper"><div class="cal-bar" style="height:' + barH + 'px;background:' + color + ';"></div></div></div>\n';
      }
    }
    h += '</div>\n<div class="cal-x-labels">';
    for (var k = 0; k < days.length; k++) {
      h += '<div class="cal-x-label">' + days[k].weekday + '</div>';
    }
    h += '</div>\n';
    return h;
  }

  // ─── Chart: Weight SVG ──────────────────────────────────────────────
  function renderWeightChart(weightReadings, allWeightData, meta, planRate) {
    if (!allWeightData || allWeightData.length < 1) {
      return '<p style="text-align:center;color:#888;">' + t('noWeight') + '</p>';
    }
    var startDate = parseDate(meta.start_date);
    var endDate = new Date(startDate); endDate.setDate(endDate.getDate() + 6);

    var points = allWeightData.slice().sort(function(a, b) { return a.date < b.date ? -1 : 1; });

    var thisWeekDates = {};
    for (var i = 0; i < points.length; i++) {
      var pd = parseDate(points[i].date);
      if (pd >= startDate && pd <= endDate) thisWeekDates[points[i].date] = true;
    }

    var xStart = 60, xSpacing = 120;
    var xs = points.map(function(_, idx) { return xStart + idx * xSpacing; });
    var svgWidth = Math.max(xs[xs.length - 1] + 60, 400);

    var vals = points.map(function(p) { return p.value; });
    var firstVal = points[0].value;
    var firstDate = parseDate(points[0].date);
    var planVals = points.map(function(p) {
      var daysFromStart = (parseDate(p.date) - firstDate) / 86400000;
      return firstVal - planRate * (daysFromStart / 7);
    });

    var allVals = vals.concat(planVals);
    var rawMin = Math.min.apply(null, allVals) - 0.5;
    var rawMax = Math.max.apply(null, allVals) + 0.5;
    var rawRange = rawMax - rawMin;
    if (rawRange < 1) rawRange = 1;
    // 动态选步长:目标 tick 数 ≤ 6。候选从小到大,取第一个满足条件的。
    var stepCandidates = [0.5, 1, 2, 2.5, 5, 10];
    var yStep = 1;
    for (var sc = 0; sc < stepCandidates.length; sc++) {
      if (Math.ceil(rawRange / stepCandidates[sc]) + 1 <= 6) { yStep = stepCandidates[sc]; break; }
    }
    // 把边界对齐到 yStep 的整数倍(避免起点是奇怪的 62.7 之类)
    var yMinVal = Math.floor(rawMin / yStep) * yStep;
    var yMaxVal = Math.ceil(rawMax / yStep) * yStep;
    var yRange = yMaxVal - yMinVal;
    if (yRange < yStep) { yRange = yStep; yMaxVal = yMinVal + yStep; }
    var yTicks = [];
    for (var yv = yMinVal; yv <= yMaxVal + 0.01; yv += yStep) yTicks.push(yv);

    var chartTop = 20, chartBottom = 150, chartHeight = chartBottom - chartTop;
    function valToY(v) { return Math.round(chartBottom - ((v - yMinVal) / yRange) * chartHeight); }

    var actualPts = points.map(function(p, idx) { return [xs[idx], valToY(p.value)]; });
    var planPts = planVals.map(function(pv, idx) { return [xs[idx], valToY(pv)]; });

    var actualPath = catmullRomPath(actualPts);
    var planPathD = catmullRomPath(planPts);

    // Y-axis
    var yAxisH = '<div class="weight-y-axis">\n';
    for (var ti = 0; ti < yTicks.length; ti++) {
      var topPxPct = (chartTop / 175) * 100 + (1 - (yTicks[ti] - yMinVal) / yRange) * (chartHeight / 175 * 100);
      yAxisH += '<span class="weight-y-label" style="top:' + topPxPct.toFixed(1) + '%">' + yTicks[ti].toFixed(1) + '</span>\n';
    }
    yAxisH += '</div>\n';

    // SVG
    var svg = '<svg width="' + svgWidth + '" height="175" viewBox="0 0 ' + svgWidth + ' 175" style="display:block;min-width:' + svgWidth + 'px;">\n';
    for (var gi = 0; gi < yTicks.length; gi++) {
      var gy = valToY(yTicks[gi]);
      svg += '<line x1="0" y1="' + gy + '" x2="' + svgWidth + '" y2="' + gy + '" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="4"/>\n';
    }
    svg += '<line x1="0" y1="' + chartBottom + '" x2="' + svgWidth + '" y2="' + chartBottom + '" stroke="#F3F4F6" stroke-width="1"/>\n';
    svg += '<defs><linearGradient id="weightGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6bcb8b" stop-opacity="0.3"/><stop offset="100%" stop-color="#6bcb8b" stop-opacity="0.02"/></linearGradient></defs>\n';

    // Plan path
    if (planPts.length >= 2) {
      svg += '<path d="' + planPathD + ' L ' + planPts[planPts.length-1][0] + ',' + chartBottom + ' L ' + planPts[0][0] + ',' + chartBottom + ' Z" fill="rgba(0,0,0,0.04)"/>\n';
      svg += '<path d="' + planPathD + '" fill="none" stroke="#ccc" stroke-width="1" opacity="0.7"/>\n';
      svg += '<text x="' + (planPts[planPts.length-1][0] - 5) + '" y="' + (chartBottom - 5) + '" text-anchor="end" font-size="8.5" fill="#bbb" font-style="italic">' + t('planRate', {rate: planRate}) + '</text>\n';
    }

    // Actual curve
    if (actualPts.length >= 2) {
      svg += '<path d="' + actualPath + ' L ' + actualPts[actualPts.length-1][0] + ',' + chartBottom + ' L ' + actualPts[0][0] + ',' + chartBottom + ' Z" fill="url(#weightGrad)"/>\n';
      svg += '<path d="' + actualPath + '" fill="none" stroke="#6bcb8b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>\n';
    }

    // Data points
    for (var di = 0; di < points.length; di++) {
      var x = actualPts[di][0], y = actualPts[di][1];
      var dd = parseDate(points[di].date);
      var label = dd.getMonth() + 1 + '/' + dd.getDate();
      var isThisWeek = thisWeekDates[points[di].date];
      if (isThisWeek) {
        svg += '<circle cx="' + x + '" cy="' + y + '" r="6" fill="#6bcb8b" stroke="#fff" stroke-width="2.5"/>\n';
        svg += '<text x="' + x + '" y="167" text-anchor="middle" font-size="10" fill="#1a1a1a" font-weight="600">' + label + '</text>\n';
        svg += '<text x="' + x + '" y="' + (y - 8) + '" text-anchor="middle" font-size="11.5" fill="#1a1a1a" font-weight="700">' + points[di].value + '</text>\n';
      } else {
        svg += '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="#fff" stroke="#a8deb8" stroke-width="2"/>\n';
        svg += '<text x="' + x + '" y="167" text-anchor="middle" font-size="9.5" fill="#aaa">' + label + '</text>\n';
        svg += '<text x="' + x + '" y="' + (y - 7) + '" text-anchor="middle" font-size="10" fill="#888" font-weight="500">' + points[di].value + '</text>\n';
      }
    }
    svg += '</svg>\n';

    var html = '<div class="weight-chart-wrapper">\n' + yAxisH;
    html += '<div class="weight-chart-container" id="weightChartContainer">\n' + svg + '</div>\n</div>\n';
    html += '<div class="weight-chart-scroll-hint">' + t('scrollHint') + '</div>\n';

    // Weight change summary
    if (weightReadings.length >= 2) {
      var change = weightReadings[weightReadings.length - 1].value - weightReadings[0].value;
      var cls = change > 0 ? 'up' : (change < 0 ? 'down' : 'same');
      var sign = change > 0 ? '+' : '';
      html += '<div class="weight-change ' + cls + '">' + t('thisWeekChange', {sign: sign, change: change.toFixed(1), from: weightReadings[0].value, to: weightReadings[weightReadings.length-1].value}) + '</div>\n';
    } else if (weightReadings.length === 1) {
      html += '<div class="weight-change">' + t('thisWeekSingle', {val: weightReadings[0].value}) + '</div>\n';
    }
    return html;
  }

  // ─── Chart: Macro bars ──────────────────────────────────────────────
  function renderMacroChart(name, dailyValues, targetLow, targetHigh, chartH, palette) {
    chartH = chartH || 160;
    // palette: { high:{c,o}, mid:{c,o}, low:{c,o} } — 高于/区间内/低于目标三档,c=色 o=不透明度
    palette = palette || {
      high: { c: '#6bcb8b', o: 0.95 }, mid: { c: '#6bcb8b', o: 0.85 }, low: { c: '#6bcb8b', o: 0.65 },
    };
    var weekdays = t('weekdays');
    var nonNull = dailyValues.filter(function(v) { return v !== null && v > 0; });
    if (!nonNull.length) return '';

    var avgVal = Math.round(nonNull.reduce(function(a, b) { return a + b; }, 0) / nonNull.length);
    var maxData = Math.max.apply(null, nonNull);
    var chartMax = Math.max(maxData, targetHigh) * 1.2;
    chartMax = Math.max(chartMax, 10);
    var ticks = niceTicks(chartMax, 3);
    if (ticks.length) {
      var tickMax = Math.max.apply(null, ticks);
      if (tickMax < chartMax) ticks.push(Math.round(tickMax + (ticks[1] - ticks[0])));
      chartMax = Math.max.apply(null, ticks);
    }

    var tLowPct = (targetLow / chartMax) * 100;
    var tHighPct = (targetHigh / chartMax) * 100;
    var avgPct = (avgVal / chartMax) * 100;

    // 按与目标区间的关系分三档:高于上限 / 区间内 / 低于下限(同色系不同深浅)
    function barStyle(val) {
      var p = val > targetHigh ? palette.high : (val < targetLow ? palette.low : palette.mid);
      return 'background:' + p.c + ';opacity:' + p.o + ';';
    }

    var h = '<div class="macro-chart-section">\n';
    h += '<div class="macro-chart-title">' + esc(name) + '</div>\n';
    h += '<div class="cal-chart" style="height:' + chartH + 'px;">\n';

    for (var i = 0; i < ticks.length; i++) {
      var tick = ticks[i];
      var pct = (tick / chartMax) * 100;
      var solid = tick === 0 ? ' border-bottom-style: solid;' : '';
      h += '<div class="cal-grid-line" style="bottom:' + pct.toFixed(1) + '%;' + solid + '"><span class="cal-grid-label">' + tick + '</span></div>\n';
    }
    h += '<div class="cal-target-band" style="bottom:' + tLowPct.toFixed(1) + '%;height:' + (tHighPct - tLowPct).toFixed(1) + '%"><span class="cal-target-label">' + t('targetLabel', {min: targetLow, max: targetHigh}) + '</span></div>\n';
    // If avg line overlaps target band, put label below the line instead of above
    var avgLabelPos = (avgVal >= targetLow && avgVal <= targetHigh) ? 'transform:translateY(2px)' : 'transform:translateY(-100%)';
    h += '<div class="macro-avg-line" style="bottom:' + avgPct.toFixed(1) + '%;"><span class="macro-avg-label" style="' + avgLabelPos + '">' + t('avgIntake', {val: avgVal}) + '</span></div>\n';

    for (var j = 0; j < dailyValues.length; j++) {
      var val = dailyValues[j];
      if (val === null || val === 0) {
        h += '<div class="cal-bar-col"><div class="cal-bar-value"></div><div class="cal-bar-wrapper"><div class="cal-bar" style="height:0px;background:transparent;"></div></div></div>\n';
      } else {
        var rounded = Math.round(val);
        var bH = Math.min(Math.round((val / chartMax) * chartH), Math.round(chartH * 0.85));
        h += '<div class="cal-bar-col"><div class="cal-bar-value">' + rounded + '</div><div class="cal-bar-wrapper"><div class="cal-bar" style="height:' + bH + 'px;' + barStyle(val) + '"></div></div></div>\n';
      }
    }
    h += '</div>\n<div class="cal-x-labels">';
    for (var k = 0; k < weekdays.length; k++) {
      h += '<div class="cal-x-label">' + weekdays[k] + '</div>';
    }
    h += '</div>\n</div>\n';
    return h;
  }

  // ─── Render full page ───────────────────────────────────────────────
  function render(data) {
    var meta = data.meta;
    var plan = data.plan;
    var summary = data.summary;
    var days = data.days;
    var weight = data.weight || {};
    var weightReadings = weight.readings || [];
    var allWeight = data.weight_all || weightReadings;
    var commentary = data.commentary || {};
    var highlights = data.highlights || [];
    var suggestions = data.suggestions || [];
    var nickname = data.nickname || '';
    var tagline = data.tagline || '';
    var planRate = data.plan_rate || 0.5;
    var weekNum = meta.week_number || 1;
    var username = data.username || 'unknown';

    // Set language from data
    lang = (meta.lang || data.lang || 'zh').toLowerCase();
    if (!I18N[lang]) lang = 'zh';

    document.title = t('title', {N: weekNum});

    var prevStart = meta.prev_start || '';
    var nextStart = meta.next_start || '';
    var prevDisabled = meta.prev_exists ? '' : ' disabled';
    var nextDisabled = meta.next_exists ? '' : ' disabled';

    var h = '';

    // Header
    h += '<header class="report-header">';
    // 标题里的周数用粉色 span 包起来,其余黑色
    h += '<h1>' + t('title', {N: '<span class="wk-num">' + weekNum + '</span>'}) + '</h1>';
    var sub = '';
    if (nickname && tagline) sub = esc(nickname) + ' · ' + esc(tagline);
    else if (nickname) sub = esc(nickname);
    else if (tagline) sub = esc(tagline);
    h += '<div class="subtitle">' + sub + '</div>';
    h += '<div class="date-range">' + meta.start_date + ' ~ ' + meta.end_date + '</div>';
    h += '</header>';

    // Empty week check — show message instead of empty charts
    var loggedDays = summary.logged_days || 0;
    if (loggedDays === 0 && allWeight.length === 0) {
      h += '<div class="report-card"><div class="card-body" style="text-align:center;padding:2rem 1rem;">';
      h += '<div style="font-size:2rem;margin-bottom:0.5rem;">📭</div>';
      h += '<div style="font-size:0.95rem;color:#666;">' + t('noData') + '</div>';
      h += '<div style="font-size:0.82rem;color:#aaa;margin-top:0.3rem;">' + t('noDataHint') + '</div>';
      h += '</div></div>';
      h += '<div class="report-footer"><img src="https://nanorhino-openclaw-user-dashboard.chatlingxi.com/logo-sm.png" alt="小犀牛"><span class="brand-name">NanoRhino</span></div><div class="report-disclaimer">' + t('disclaimer') + '</div>';
      // Nav 挪到最后
      h += '<nav class="week-nav">';
      h += '<a class="week-nav-btn week-nav-prev' + prevDisabled + '" data-week="' + prevStart + '">' + t('prevWeek') + '</a>';
      h += '<span class="week-nav-current">' + t('weekLabel', {N: weekNum}) + '</span>';
      h += '<a class="week-nav-btn week-nav-next' + nextDisabled + '" data-week="' + nextStart + '">' + t('nextWeek') + '</a>';
      h += '</nav>';

      document.getElementById('content').innerHTML = h;
      document.getElementById('content').style.display = '';
      document.getElementById('loading').style.display = 'none';
      // Nav click handlers
      var emptyNavBtns = document.querySelectorAll('.week-nav-btn:not(.disabled)');
      for (var en = 0; en < emptyNavBtns.length; en++) {
        emptyNavBtns[en].addEventListener('click', function(e) {
          e.preventDefault();
          var week = this.getAttribute('data-week');
          if (week) { history.pushState(null, '', location.pathname + '?week=' + week); loadWeek(week); }
        });
      }
      return;
    }

    // Section 0: 本周亮点(第一张卡,淡粉渐变)
    h += '<div class="report-card highlight-card"><div class="card-header">' + t('highlightsOnlyHeader') + '</div><div class="card-body">';
    if (highlights.length) {
      h += '<ul class="achievement-list">';
      for (var hi0 = 0; hi0 < highlights.length; hi0++) h += '<li>' + esc(highlights[hi0]) + '</li>';
      h += '</ul>';
    } else {
      h += '<ul class="achievement-list"><li>' + t('defaultHighlight') + '</li></ul>';
    }
    h += '</div></div>';

    // Section 1: Logging Calendar
    h += '<div class="report-card"><div class="card-header">' + t('loggingHeader') + '</div><div class="card-body">';
    h += '<div class="logging-grid">';
    var wdays = t('weekdays');
    for (var i = 0; i < days.length; i++) h += '<div class="day-label">' + (wdays[i] || days[i].weekday) + '</div>';
    h += '</div><div class="logging-grid">';
    // 动态推断本周用户的餐次:整周 meals 里出现过的主餐类型(早/午/晚)
    // 若某餐一次都没出现过 → 视为用户不固定吃这餐,不为它保留格子
    var weekMealTypes = {};
    for (var wm = 0; wm < days.length; wm++) {
      var ms = days[wm].meals || [];
      for (var mn = 0; mn < ms.length; mn++) weekMealTypes[ms[mn].meal_type] = true;
    }
    var typesOrder = ['breakfast', 'lunch', 'dinner'];
    var activeTypes = typesOrder.filter(function(t) { return weekMealTypes[t]; });
    // 兜底:整周啥都没记(空周),仍显示 3 格灰
    if (activeTypes.length === 0) activeTypes = typesOrder;
    for (var j = 0; j < days.length; j++) {
      var meals = (days[j].meals || []).map(function(m) { return m.meal_type; });
      var cells = '';
      for (var k = 0; k < activeTypes.length; k++) {
        var hit = days[j].logged && meals.indexOf(activeTypes[k]) !== -1;
        cells += '<div class="meal-cell' + (hit ? ' hit' : '') + '"></div>';
      }
      h += '<div class="day-cells">' + cells + '</div>';
    }
    h += '</div>';
    h += '<div class="logging-summary">' + t('loggingDays', {x: summary.logged_days, y: summary.total_days}) + '</div>';
    // 各餐命中次数汇总(只显示本周出现过的餐次,分母=总天数)
    var tallyMap = { breakfast: 0, lunch: 0, dinner: 0 };
    for (var td = 0; td < days.length; td++) {
      var dMeals = (days[td].meals || []).map(function(m) { return m.meal_type; });
      if (dMeals.indexOf('breakfast') !== -1) tallyMap.breakfast++;
      if (dMeals.indexOf('lunch') !== -1) tallyMap.lunch++;
      if (dMeals.indexOf('dinner') !== -1) tallyMap.dinner++;
    }
    var labelMap = { breakfast: t('mealBreakfast'), lunch: t('mealLunch'), dinner: t('mealDinner') };
    var prevFreq = data.prev_meal_freq || {};
    var tallyHtml = '';
    for (var ti = 0; ti < activeTypes.length; ti++) {
      var mt = activeTypes[ti];
      // 较上周差值:本周命中 - 上周命中(有上周数据才显示)
      var deltaHtml = '';
      if (data.prev_meal_freq && typeof prevFreq[mt] === 'number') {
        var diff = tallyMap[mt] - prevFreq[mt];
        if (diff === 0) {
          deltaHtml = '<span class="tally-delta">' + t('sameAsLastWeek') + '</span>';
        } else {
          var sign = diff > 0 ? '+' : '−';
          var arrow = diff > 0 ? ' ↑' : ' ↓';
          deltaHtml = '<span class="tally-delta">' + t('vsLastWeek') + sign + Math.abs(diff) + arrow + '</span>';
        }
      }
      tallyHtml += '<div class="tally-item">' +
        '<span class="tally-mealname">' + labelMap[mt] + '</span>' +
        '<span class="tally-num"><span class="cur">' + tallyMap[mt] + '</span><span class="denom">/' + days.length + '</span></span>' +
        deltaHtml +
      '</div>';
    }
    h += '<div class="meal-tally">' + tallyHtml + '</div>';
    h += '</div>';
    if (commentary.logging) h += '<div class="card-commentary">' + esc(stripEmoji(commentary.logging)) + '</div>';
    h += '</div>';

    // Section 2: Calorie Analysis
    var calMin, calMaxTarget;
    if (Array.isArray(plan.cal_min)) {
      calMin = plan.cal_min[0];
      calMaxTarget = plan.cal_min[1];
    } else {
      calMin = summary.cal_min || plan.cal_min || 1600;
      calMaxTarget = summary.cal_max_target || 2000;
    }
    var loggedCals = days.filter(function(d) { return d.logged; }).map(function(d) { return d.totals.cal; });
    var chartMax = summary.chart_max || Math.max(Math.max.apply(null, loggedCals.length ? loggedCals : [0]), calMaxTarget * 1.2);

    h += '<div class="report-card"><div class="card-header">' + t('calorieHeader') + '</div><div class="card-body cal-body">';
    h += renderCalorieChart(days, calMin, calMaxTarget, chartMax);
    h += '<div class="cal-target-note">' + t('avgCalTarget', {min: calMin, max: calMaxTarget}) + '</div>';
    h += '<div class="cal-average">' + t('avgCalSimple', {avg: summary.cal_avg}) + '</div>';
    h += '</div>';
    if (commentary.calories) h += '<div class="card-commentary">' + esc(commentary.calories) + '</div>';
    h += '</div>';

    // Section 3: Weight Chart
    if (allWeight.length > 0) {
      h += '<div class="report-card"><div class="card-header">' + t('weightHeader') + '</div><div class="card-body">';
      h += renderWeightChart(weightReadings, allWeight, meta, planRate);
      h += '</div>';
      if (commentary.weight) h += '<div class="card-commentary">' + esc(commentary.weight) + '</div>';
      h += '</div>';
    }

    // Section 4: Macronutrient Analysis
    var proteinRange = plan.protein_range || [0, 0];
    var fatRange = plan.fat_range || [0, 0];
    var carbRange = plan.carb_range || [0, 0];

    var proteinVals = days.map(function(d) { return (d.logged && d.totals.protein > 0) ? d.totals.protein : null; });
    var fatVals = days.map(function(d) { return (d.logged && d.totals.fat > 0) ? d.totals.fat : null; });
    var carbVals = days.map(function(d) { return (d.logged && d.totals.carb > 0) ? d.totals.carb : null; });

    var hasAnyMacro = proteinVals.concat(fatVals, carbVals).some(function(v) { return v; });
    if (hasAnyMacro) {
      var macroH = '';
      // 三档色(高于上限/区间内/低于下限),不透明度 95%/85%/65%
      var CARB_PAL = { high: { c: '#FEBD1B', o: 0.95 }, mid: { c: '#FFC945', o: 0.85 }, low: { c: '#FFDD89', o: 0.65 } };
      var PROTEIN_PAL = { high: { c: '#8015D9', o: 0.95 }, mid: { c: '#963DE0', o: 0.85 }, low: { c: '#D7B1F7', o: 0.65 } };
      var FAT_PAL = { high: { c: '#2195FF', o: 0.95 }, mid: { c: '#4FA8F9', o: 0.85 }, low: { c: '#5EA9EE', o: 0.65 } };
      if (carbVals.some(function(v) { return v; })) macroH += renderMacroChart(t('carbs'), carbVals, carbRange[0], carbRange[1], undefined, CARB_PAL);
      if (proteinVals.some(function(v) { return v; })) macroH += renderMacroChart(t('protein'), proteinVals, proteinRange[0], proteinRange[1], undefined, PROTEIN_PAL);
      if (fatVals.some(function(v) { return v; })) macroH += renderMacroChart(t('fat'), fatVals, fatRange[0], fatRange[1], undefined, FAT_PAL);

      if (summary.macro_estimated) {
        macroH += '<p style="text-align:center;font-size:0.72rem;color:#bbb;margin-top:0.5rem;">' + t('macroEstNote') + '</p>';
      }

      h += '<div class="report-card"><div class="card-header">' + t('macroHeader') + '</div><div class="card-body">';
      h += macroH;
      h += '</div>';
      if (commentary.macros) h += '<div class="card-commentary">' + esc(commentary.macros) + '</div>';
      h += '</div>';
    }

    // Section 5: 下周建议(最后一张卡)
    h += '<div class="report-card"><div class="card-header">' + t('suggestionsOnlyHeader') + '</div><div class="card-body">';
    if (suggestions.length) {
      h += '<ul class="suggestion-list">';
      for (var si5 = 0; si5 < suggestions.length; si5++) h += '<li>' + esc(suggestions[si5]) + '</li>';
      h += '</ul>';
    } else {
      h += '<ul class="suggestion-list"><li>' + t('defaultSuggestion') + '</li></ul>';
    }
    h += '</div></div>';

    // Nav:紧跟"下周建议"卡片后面
    h += '<nav class="week-nav">';
    h += '<a class="week-nav-btn week-nav-prev' + prevDisabled + '" data-week="' + prevStart + '">' + t('prevWeek') + '</a>';
    h += '<span class="week-nav-current">' + t('weekLabel', {N: weekNum}) + '</span>';
    h += '<a class="week-nav-btn week-nav-next' + nextDisabled + '" data-week="' + nextStart + '">' + t('nextWeek') + '</a>';
    h += '</nav>';

    // Footer
    h += '<div class="report-footer"><img src="https://nanorhino-openclaw-user-dashboard.chatlingxi.com/logo-sm.png" alt="小犀牛"><span class="brand-name">NanoRhino</span></div><div class="report-disclaimer">' + t('disclaimer') + '</div>';

    document.getElementById('content').innerHTML = h;
    document.getElementById('content').style.display = '';
    document.getElementById('loading').style.display = 'none';

    // Scroll weight chart to right
    setTimeout(function() {
      var c = document.getElementById('weightChartContainer');
      if (c) c.scrollLeft = c.scrollWidth;
    }, 100);

    // Nav click handlers
    var navBtns = document.querySelectorAll('.week-nav-btn:not(.disabled)');
    for (var ni = 0; ni < navBtns.length; ni++) {
      navBtns[ni].addEventListener('click', function(e) {
        e.preventDefault();
        var week = this.getAttribute('data-week');
        if (week) {
          var newUrl = location.pathname + '?week=' + week;
          history.pushState(null, '', newUrl);
          loadWeek(week);
        }
      });
    }
  }

  // ─── Data loading ───────────────────────────────────────────────────
  function getBaseUrl() {
    var path = location.pathname;
    var idx = path.lastIndexOf('/');
    return idx >= 0 ? path.substring(0, idx + 1) : './';
  }

  function loadWeek(week) {
    document.getElementById('loading').style.display = '';
    document.getElementById('content').style.display = 'none';
    document.getElementById('error').style.display = 'none';

    var base = getBaseUrl();
    var cacheBust = '?v=' + Math.floor(Date.now() / 60000); // bust cache every minute
    var jsonUrl = week ? base + 'weekly-data-' + week + '.html' + cacheBust : base + 'weekly-data-latest.html' + cacheBust;

    fetch(jsonUrl).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      render(data);
    }).catch(function(err) {
      document.getElementById('loading').style.display = 'none';
      var errEl = document.getElementById('error');
      errEl.textContent = week ? t('weekNotFound', {week: week}) : t('noReportYet');
      errEl.style.display = '';
    });
  }

  // ─── Init ───────────────────────────────────────────────────────────
  var params = new URLSearchParams(location.search);
  var week = params.get('week');
  loadWeek(week);

  // Handle browser back/forward
  window.addEventListener('popstate', function() {
    var p = new URLSearchParams(location.search);
    loadWeek(p.get('week'));
  });
})();
</script>
